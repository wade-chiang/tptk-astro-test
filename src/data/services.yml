# 服務項目：每筆一個 name 和 content

- name: 疼痛治療
  content: 五十肩、坐骨神經痛、運動傷害、媽媽手、腳踝扭傷、手腳酸麻、客製化鞋墊適配
- name: 神經復健
  content: 中風偏癱、巴金森氏症、腦傷、脊髓損傷、肢體動作誘發、週邊神經動作控制引導
- name: 術後恢復
  content: 膝關節置換、髖關節置換、肌腱韌帶斷裂修補、術前肌力強化準備、十字韌帶修補
- name: 筋膜放鬆
  content: 徒手治療、全身性緊繃筋膜放鬆、運動後按摩放鬆加速修復、四肢腫脹消除、促進淋巴循環
- name: 小兒復健
  content: 先天活動能力發展延遲、腦性麻痺一對一物理治療、通用與客製化輔具指引
- name: 運動強化與姿態矯正
  content: 運動專項強化指導、運動按摩筋膜放鬆、脊椎側彎徒手矯治與客製化運動指導
