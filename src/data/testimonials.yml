# 病友回饋：paragraphs 每一項是一段
# role 可留空

- name: C先生
  role: Bass手、新手奶爸
  image: https://img.tptk.com.tw/client-01.webp
  paragraphs:
    - 自從當了新手奶爸之後，以前背琴導致的肩背疼痛變得日益嚴重。侯老師除了徒手治療舒緩疼痛之外，也會教我正確的施力方式（彎腰、抱小孩之類的）與加強肌肉強度，讓我可以從日常生活中去避免這些疼痛！
- name: 大安區 H女士與T先生
  role: ""
  image: https://img.tptk.com.tw/client-02.webp
  paragraphs:
    - 去年我太太肺癌住院，不幸又中風，右手、右腳不能動。出院回家後，我兒子找到侯毅農老師，來給我太太做復健。
    - 我太太原先右手、右腳都不能動。經過侯老師這幾個月來的復健，現在慢慢的右手可以動一動也有些力氣了。右腳在侯老師細心、耐心的幫助下，也可以下床練習走路了。
    - 感恩特別有愛心的侯老師。也希望我太太在侯老師的幫助下能早日康復痊癒。再次感謝🙏！
- name: 信義區 H先生
  role: 牙醫師 健行慢跑愛好者
  image: https://img.tptk.com.tw/client-03.webp
  paragraphs:
    - 幾個月前運動時不慎扭傷膝蓋，由於消腫後疼痛狀況依然明顯，經由介紹來到厝邊頭家物理治療所，在哲慶老師的細心治療下，原本受限的動作範圍漸漸地恢復正常，疼痛的狀況也不再有。
    - 過程中老師會詳細說明，也教導我在家能夠自己做的放鬆及拉筋等動作，在問題獲得解決的同時也擁有能降低再受傷風險的知識，十分推薦
    - （其實只想講一句：X！又可以慢跑了，爽啦！）
- name: 中正區 T小姐
  role: ""
  image: https://img.tptk.com.tw/client-04.webp
  paragraphs:
    - 我是因為半月板破裂，開了膝蓋關節鏡手術。開刀後沾黏、萎縮。我幾乎無法伸直、甚至膝蓋無法彎曲超過九十度，讓我行動非常不便。還好李宜蓁老師每一次都耐心協助復健、放鬆、超音波……
    - 每一次鬆開一點沾黏，讓我不會這麼痛，當我感受到我能正常走路的時候真的好感動。謝謝李老師。
